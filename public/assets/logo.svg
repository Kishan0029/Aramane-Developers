<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none">
  <!-- Greek Temple Emblem (Pediment + 6 Columns + Stepped Base) -->
  <g transform="translate(10, 10)">
    <!-- Pediment (Triangular roof) -->
    <path d="M 35 4 L 4 20 L 66 20 Z" fill="#B8975A" />
    <path d="M 35 9 L 14 19 L 56 19 Z" fill="#F5F0E6" opacity="0.4" />
    
    <!-- Entablature / Architrave (Beam) -->
    <rect x="3" y="21" width="64" height="4" rx="0.5" fill="#B8975A" />
    
    <!-- 6 Columns -->
    <g fill="#B8975A">
      <!-- Col 1 -->
      <rect x="7" y="27" width="4" height="26" rx="0.5" />
      <rect x="5.5" y="25" width="7" height="2" />
      <rect x="5.5" y="53" width="7" height="2" />
      
      <!-- Col 2 -->
      <rect x="18" y="27" width="4" height="26" rx="0.5" />
      <rect x="16.5" y="25" width="7" height="2" />
      <rect x="16.5" y="53" width="7" height="2" />
      
      <!-- Col 3 -->
      <rect x="29" y="27" width="4" height="26" rx="0.5" />
      <rect x="27.5" y="25" width="7" height="2" />
      <rect x="27.5" y="53" width="7" height="2" />
      
      <!-- Col 4 -->
      <rect x="40" y="27" width="4" height="26" rx="0.5" />
      <rect x="38.5" y="25" width="7" height="2" />
      <rect x="38.5" y="53" width="7" height="2" />
      
      <!-- Col 5 -->
      <rect x="51" y="27" width="4" height="26" rx="0.5" />
      <rect x="49.5" y="25" width="7" height="2" />
      <rect x="49.5" y="53" width="7" height="2" />
      
      <!-- Col 6 -->
      <rect x="62" y="27" width="4" height="26" rx="0.5" />
      <rect x="60.5" y="25" width="7" height="2" />
      <rect x="60.5" y="53" width="7" height="2" />
    </g>
    
    <!-- Stylobate (Stepped base: 2 tiers) -->
    <rect x="3" y="55" width="64" height="3" rx="0.5" fill="#B8975A" />
    <rect x="0" y="58" width="70" height="4" rx="0.5" fill="#B8975A" />
  </g>
  
  <!-- Wordmark: ARAMANE -->
  <text x="96" y="44" font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="600" letter-spacing="5" fill="#1B2A49">ARAMANE</text>
  
  <!-- Ornamental Line with Center Diamond -->
  <line x1="96" y1="52" x2="195" y2="52" stroke="#B8975A" stroke-width="1" stroke-opacity="0.6" />
  <polygon points="202,52 205,49 208,52 205,55" fill="#B8975A" />
  <line x1="215" y1="52" x2="314" y2="52" stroke="#B8975A" stroke-width="1" stroke-opacity="0.6" />
  
  <!-- Tagline: TIMELESS LIVING -->
  <text x="135" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="5" fill="#B8975A">TIMELESS LIVING</text>
</svg>
